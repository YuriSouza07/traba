<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cliente | Artwalk Tênis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AOS (Animate On Scroll) -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><h1>Artwalk Tênis</h1></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
          <li class="nav-item"><a class="nav-link" href="precos.html">Preços</a></li>
          <li class="nav-item"><a class="nav-link active" href="cadastro.html">Cadastro</a></li>
          <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
          <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho 🛒</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container my-5">
    <h2 class="text-center mb-4 fw-bold" data-aos="zoom-in">Cadastro de Cliente</h2>
    <form data-aos="fade-up" data-aos-duration="1000">
      <div class="mb-3" data-aos="fade-up" data-aos-delay="100">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" required>
      </div>
      <div class="mb-3" data-aos="fade-up" data-aos-delay="200">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3" data-aos="fade-up" data-aos-delay="300">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" required>
      </div>
      <div class="mb-3" data-aos="fade-up" data-aos-delay="400">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" required>
      </div>
      <div class="mb-3" data-aos="fade-up" data-aos-delay="500">
        <label class="form-label">CEP</label>
        <input type="text" class="form-control" required>
      </div>
      <div class="mb-3" data-aos="fade-up" data-aos-delay="600">
        <label class="form-label">Endereço</label>
        <input type="text" class="form-control" required>
      </div>
      <button class="btn btn-success w-100" data-aos="zoom-in" data-aos-delay="700">Cadastrar</button>
      <div class="text-center mt-4" data-aos="zoom-in" data-aos-delay="800">
        <a href="index.html" class="btn btn-secondary px-4 py-2">Voltar</a>
      </div>
    </form>
  </div>

  <!-- Rodapé -->
  <footer class="bg-dark text-white text-center p-3 mt-5" data-aos="fade-up">
    <p>&copy; 2026 Artwalk Tênis | Venham conferir nossos Tênis</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS (Animate On Scroll) -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800, // duração das animações
      once: true     // anima apenas uma vez ao aparecer
    });
  </script>

</body>
</html>
